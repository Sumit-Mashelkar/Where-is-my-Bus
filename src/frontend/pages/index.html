<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Where is my Bus</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="landing-shell">
      <div class="app-header">
        <p class="eyebrow">TransitPulse</p>
        <h1 id="title">Where is my Bus</h1>
      </div>

      <section class="search-panel" aria-label="Route search">
        <h2>Find Your Bus</h2>
        <input type="text" placeholder="Starting stop" />
        <input type="text" placeholder="Destination stop" />
        <button id="searchBtn" type="button">Find Buses</button>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
